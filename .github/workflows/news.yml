name: Morning News Telegram Bot

on:
  schedule:
    # 00:00 UTC = 07:00 น. เวลาไทย
    - cron: '0 0 * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันทดสอบได้ทันที

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests feedparser

      - name: Run Script
        run: python main.py
